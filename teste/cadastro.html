<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EducaLetra - Cadastro</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <div class="login-box">
      <h1>Criar Conta</h1>
      <form id="cadastroForm">
        <input type="text" id="nome" placeholder="Nome" required />
        <input type="text" id="sobrenome" placeholder="Sobrenome" required />
        <input type="email" id="cadastroEmail" placeholder="E-mail" required />
        <input type="password" id="cadastroSenha" placeholder="Senha" required />
        <button type="submit">Criar Conta</button>
        <p>Já tem conta? <a href="index.html">Entrar</a></p>
      </form>
      <p id="cadastroErro" class="erro"></p>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
