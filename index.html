<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EducaLetra</title>

  <link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
  rel="stylesheet"
  />


  <link rel="icon" href="imagem/logo.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="top-bar">
    

    <div class="logo">
      <img src="imagem/logoletra.png" alt="Logo do EducaLetra" />
    </div>


    <div class="subtitle">Brincando e aprendendo!</div>

  
    <nav>
    
      <button class="nav" onclick="reiniciarPagina()">início</button>

  
      <button class="nav" onclick="document.getElementById('footer').scrollIntoView({ behavior: 'smooth' })">sobre</button>

  
      <button class="nav entrar" onclick="mostrarFormulario()">entrar</button>
    </nav>
  </div>


  <div class="container">
    

    <div class="left" id="leftSide">

   
      <div class="intro-text" id="introText">

      </div>

      <form class="formulario" id="formulario"><form class="formulario card p-4 shadow" id="formulario">

  <h3 id="formTitulo">Entrar</h3>


  <div class="inputs" id="cadastroCampos" style="display: none;">
    <input type="text" id="nome" class="form-control mb-2" placeholder="Nome" />
    <input type="text" id="sobrenome" class="form-control mb-2" placeholder="Sobrenome" />
  </div>


    <input type="email" id="email" class="form-control mb-2" placeholder="E-mail" required>
    <input type="password" id="senha" class="form-control mb-2" placeholder="Senha" required>


  <button
  type="submit"
  id="botaoForm"
  class="btn btn-primary w-50 mt-3"
>
  Entrar
</button>



  <p id="alternarTexto">Não possui conta? <a href="#" id="alternarLink">Criar conta</a></p>


<p id="mensagemErro" class="erro"></p>
</form>
    </div>

  
<div class="right">
  <div class="right-content">
    <h1>Vamos <br /> aprender a ler e escrever!</h1>
    <img src="imagem/blocoEduca.png" alt="Blocos ABC" class="abc-img" />
  </div>
</div>
  </div>


  <footer id="footer">
    <p>EducaLetra é um projeto voltado para a alfabetização infantil com atividades interativas, jogos e recursos educativos.</p>
    <p>© 2025 EducaLetra. Todos os direitos reservados. Criado por Th e Ga.</p>
  </footer>

  
  <script>

    function mostrarFormulario() {
      document.getElementById("introText").style.display = "none";
      document.getElementById("formulario").classList.add("active");
      //AQUIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIII
      setTimeout(() => {
        botaoForm.classList.add("btn", "btn-primary");
      }, 10);
    }


    function reiniciarPagina() {
      document.getElementById("introText").style.display = "block";
      document.getElementById("formulario").classList.remove("active");
    }

  const formulario = document.getElementById("formulario");
  const cadastroCampos = document.getElementById("cadastroCampos");
  const formTitulo = document.getElementById("formTitulo");
  const botaoForm = document.getElementById("botaoForm");
  const alternarTexto = document.getElementById("alternarTexto");
  const alternarLink = document.getElementById("alternarLink");
  const mensagemErro = document.getElementById("mensagemErro");

  let modoCadastro = false;


  function atualizarInterfaceCadastro() {
    cadastroCampos.style.display = modoCadastro ? "flex" : "none";
    formTitulo.textContent = modoCadastro ? "Criar Conta" : "Entrar";
    botaoForm.textContent = modoCadastro ? "Criar Conta" : "Entrar";
    alternarTexto.innerHTML = modoCadastro
      ? 'Já tem conta? <a href="#" id="alternarLink">Entrar</a>'
      : 'Não possui conta? <a href="#" id="alternarLink">Criar conta</a>';
    mensagemErro.textContent = "";


    document.getElementById("alternarLink").addEventListener("click", (e) => {
      e.preventDefault();
      modoCadastro = !modoCadastro;
      atualizarInterfaceCadastro();
    });
  }

  alternarLink.addEventListener("click", (e) => {
    e.preventDefault();
    modoCadastro = !modoCadastro;
    atualizarInterfaceCadastro();
  });


  function getUsuarios() {
    return JSON.parse(localStorage.getItem("usuarios") || "[]");
  }

  function salvarUsuario(usuario) {
    const usuarios = getUsuarios();
    usuarios.push(usuario);
    localStorage.setItem("usuarios", JSON.stringify(usuarios));
  }

  formulario.addEventListener("submit", (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value.trim();

    if (modoCadastro) {
      // Cadastro
      const nome = document.getElementById("nome").value.trim();
      const sobrenome = document.getElementById("sobrenome").value.trim();

      if (!nome || !sobrenome || !email || !senha) {
        mensagemErro.textContent = "Preencha todos os campos.";
        return;
      }

      const usuarios = getUsuarios();
      if (usuarios.find((u) => u.email === email)) {
        mensagemErro.textContent = "E-mail já cadastrado.";
        return;
      }

      salvarUsuario({ nome, sobrenome, email, senha, pontuacao: 0 });
      alert("Conta criada com sucesso!");
      modoCadastro = false;
      formulario.reset();
      atualizarInterfaceCadastro();
    } else {
      // Login
      const usuarios = getUsuarios();
      const usuario = usuarios.find((u) => u.email === email && u.senha === senha);

      if (!usuario) {
        mensagemErro.textContent = "E-mail ou senha incorretos ou conta não cadastrada.";
        return;
      }

      sessionStorage.setItem("usuarioLogado", JSON.stringify(usuario));
      window.location.href = "jogos.html";
    }
  });


  atualizarInterfaceCadastro();
</script>


</body>
</html>
