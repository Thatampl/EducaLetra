<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Sílabas</title>
  <link rel="icon" href="imagem/logo.png" type="image/png" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0ece2;
      text-align: center;
      padding: 0;
      margin: 0;
    }
    .voltar {
      background: #7607aa;
      color: white;
      padding: 8px 20px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s;
      align-self: start;
    }
    .voltar:hover {
      background: #6a1a93;
    }

    header {
      background-color: #935394;
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      padding: 30px;
    }

    img {
     max-width: 200px;
      height: auto;
      margin: 20px auto;
      border-radius: 10px;
      border: 2px solid #935394;
    }

    .sylables {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sylables button {
      background: #d1c4e9;
      border: none;
      padding: 20px 30px;
      font-size: 1.5em;
      border-radius: 10px;
      cursor: pointer;
    }

    .response {
      margin-top: 30px;
      font-size: 1.2em;
      color: #333;
    }

    .word-preview {
      margin-top: 20px;
      font-weight: bold;
      font-size: 1.5em;
      color: #4a148c;
    }

    .btn {
      margin-top: 20px;
      padding: 12px 20px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      background-color: #65bd68;
      color: white;
      cursor: pointer;
    }

    
  </style>
</head>
<body>
  <header>
    <button class="voltar" onclick="window.location.href = 'mapasilaba.html'">Voltar</button>
    <h1>EducaLetra</h1>
    <p>Monte a palavra correta com as sílabas!</p>
  </header>

  <div class="container">
    <img id="imagem" src="" alt="Imagem">
    <div>
      <audio id="audioPalavra" controls></audio>
    </div>
    <div class="word-preview" id="preview"></div>
    <div class="sylables" id="opcoes"></div>
    <div class="response" id="mensagem"></div>

    <button class="btn" onclick="proximaPalavra()" id="btnProxima">Próxima Palavra</button>
    <button class="btn" onclick="reiniciar()" id="btnReiniciar" style="display:none">Tentar Novamente</button>
    <button class="btn" id="btnVoltar" onclick="voltarParaMapa()" style="display: none">Voltar para Fases</button>
    <audio id="audioSilaba"></audio>
  </div>

  <script>
    const palavrasPorNivel = {
  facil: [
    { imagem: "gato.png", silabas: ["ga", "to"], correta: "gato" },
    { imagem: "dado.png", silabas: ["da", "do"], correta: "dado" },
    { imagem: "maçã.png", silabas: ["ma", "çã"], correta: "maçã" },
    { imagem: "uva.png", silabas: ["u", "va"], correta: "uva" },
    { imagem: "ovo.png", silabas: ["o", "vo"], correta: "ovo" },
    { imagem: "vaca.png", silabas: ["va", "ca"], correta: "vaca" },
    { imagem: "sapo.png", silabas: ["sa", "po"], correta: "sapo" },
    { imagem: "mesa.png", silabas: ["me", "sa"], correta: "mesa" },
    { imagem: "bola.png", silabas: ["bo", "la"], correta: "bola" },
    { imagem: "casa.png", silabas: ["ca", "sa"], correta: "casa" }
  ],
  normal: [
    { imagem: "lápis.png", silabas: ["lá", "pis"], correta: "lápis" },
    { imagem: "xicara.png", silabas: ["xí", "ca", "ra"], correta: "xícara" },
    { imagem: "janela.png", silabas: ["ja", "ne", "la"], correta: "janela" },
    { imagem: "zebra.png", silabas: ["ze", "bra"], correta: "zebra" },
    { imagem: "coruja.png", silabas: ["co", "ru", "ja"], correta: "coruja" },
    { imagem: "camisa.png", silabas: ["ca", "mi", "sa"], correta: "camisa" },
    { imagem: "jacaré.png", silabas: ["ja", "ca", "ré"], correta: "jacaré" },
    { imagem: "caderno.png", silabas: ["ca", "der", "no"], correta: "caderno" }
  ],
  dificil: [
    { imagem: "mochila.png", silabas: ["mo", "chi", "la"], correta: "mochila" },
    { imagem: "teclado.png", silabas: ["te", "cla", "do"], correta: "teclado" },
    { imagem: "elefante.png", silabas: ["e", "le", "fan", "te"], correta: "elefante" },
    { imagem: "borboleta.png", silabas: ["bor", "bo", "le", "ta"], correta: "borboleta" }, 
    { imagem: "computador.png", silabas: ["com", "pu", "ta", "dor"], correta: "computador" },
    { imagem: "bicicleta.png", silabas: ["bi", "ci", "cle", "ta"], correta: "bicicleta" },
    { imagem: "brinquedo.png", silabas: ["brin", "que", "do"], correta: "brinquedo" },
    { imagem: "professor.png", silabas: ["pro", "fes", "sor"], correta: "professor" },
    { imagem: "dinossauro.png", silabas: ["di", "nos", "sau", "ro"], correta: "dinossauro" }, 
    { imagem: "ventilador.png", silabas: ["ven", "ti", "la", "dor"], correta: "ventilador" }
  ]
};


    let palavrasSelecionadas = [];
    let indice = 0;
    let tentativa = [];
    let acertos = 0;
    let erros = 0;

    const audioPalavra = document.getElementById("audioPalavra");
    const audioSilaba = document.getElementById("audioSilaba");

    function embaralhar(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function carregarJogo() {
      tentativa = [];
      const palavra = palavrasSelecionadas[indice];

      document.getElementById('btnProxima').style.display = "none";
      document.getElementById('imagem').src = `imagem/${palavra.imagem}`;
      document.getElementById('mensagem').innerText = "";
      document.getElementById('preview').innerText = "";
      audioPalavra.src = `audio/${palavra.correta}.mp3`;
      audioPalavra.load();

      const opcoes = embaralhar([...palavra.silabas]);
      const container = document.getElementById('opcoes');
      container.innerHTML = "";

      opcoes.forEach(s => {
        const btn = document.createElement("button");
        btn.innerText = s;
        btn.classList.add("silaba-btn");

        btn.onclick = () => {
          audioSilaba.src = `audio/${s}.mp3`;
          audioSilaba.play();

          tentativa.push(s);
          document.getElementById('preview').innerText = tentativa.join('');

          if (tentativa.join('') === palavra.correta) {
            document.getElementById('mensagem').innerText = "✅ Parabéns! Você acertou!";
            acertos++;
            document.querySelectorAll(".silaba-btn").forEach(b => b.disabled = true);
            document.getElementById('btnProxima').style.display = "inline";
          } else if (tentativa.join('').length >= palavra.correta.length) {
            document.getElementById('mensagem').innerText = "❌ Quase lá!";
            document.querySelectorAll(".silaba-btn").forEach(b => b.disabled = true);
            document.getElementById('btnProxima').style.display = "inline";
            tentativa = [];
            erros++;
          }
        };

        container.appendChild(btn);
      });
    }

    function proximaPalavra() {
      indice++;
      if (indice >= palavrasSelecionadas.length) {
        mostrarResumo();
      } else {
        carregarJogo();
      }
    }

    function mostrarResumo() {
      document.getElementById('imagem').style.display = "none";
      audioPalavra.style.display = "none";
      document.getElementById('opcoes').innerHTML = "";
      document.getElementById('preview').innerText = "";
      document.getElementById('mensagem').innerHTML = `
        <h3>🎉 Fim do jogo!</h3>
        <p>✔️ Acertos: <strong>${acertos}</strong></p>
        <p>❌ Erros: <strong>${erros}</strong></p>
      `;
      document.getElementById('btnProxima').style.display = "none";
      document.getElementById('btnReiniciar').style.display = "inline-block";
      document.getElementById("btnVoltar").style.display = "inline-block";

      const params = new URLSearchParams(window.location.search);
      const faseAtual = parseInt(params.get("fase") || "1");
      const progressoKey = "silaba_progresso";
      const progressoAtual = parseInt(localStorage.getItem(progressoKey) || "1");

      if (faseAtual >= progressoAtual) {
        localStorage.setItem(progressoKey, faseAtual + 1);
      }
      // Salvar erros da fase (para mostrar estrela no mapa)
      localStorage.setItem("silaba_erros_" + faseAtual, erros.toString());

    }

    function reiniciar() {
  const params = new URLSearchParams(window.location.search);
  const fase = parseInt(params.get("fase") || "1");

  let nivel = "facil";
  if (fase >= 5 && fase <= 7) {
    nivel = "normal";
  } else if (fase >= 8) {
    nivel = "dificil";
  }

  const palavrasDoNivel = [...palavrasPorNivel[nivel]];
  palavrasSelecionadas = embaralhar(palavrasDoNivel).slice(0, 5);

  indice = 0;
  acertos = 0;
  erros = 0;

  document.getElementById('imagem').style.display = "inline";
  audioPalavra.style.display = "inline";
  document.getElementById('btnProxima').style.display = "inline";
  document.getElementById('btnReiniciar').style.display = "none";
  document.getElementById("btnVoltar").style.display = "none";

  carregarJogo();
}


    reiniciar();

    function voltarParaMapa() {
      window.location.href = "mapasilaba.html";
    }
  </script>
</body>
</html>
