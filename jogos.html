<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EducaLetra</title>
    <link rel="icon" href="imagem/logo.png" type="image/png" />


    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f0ece2;
        margin: 0;
        padding: 0;
        background-image: url("imagem/fundoc.png");
      }


      header {
        background-color: #935394;
        color: white;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      header h1 {
        margin: 0;
        font-size: 2.3em;
        font-weight: bold;
      }

      .escolha-jogo {
        margin-top: 10px;
        font-size: 1.2em;
      }


      header button {
        background: #7607aa;
        color: white;
        padding: 10px 30px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.3s;
        align-self: flex-start;
      }

      header button:hover {
        background: #6a1a93;
      }

   
      .baloes {
        display: flex;
        justify-content: center;
        gap: 120px;
        margin-top: 100px;
      }

      .botao-jogo {
        background: #865aac;
        padding: 45px;
        border-radius: 30%;
        color: white;
        font-size: 2em;
        font-weight: bold;
        text-align: center;
        width: 250px;
        height: 250px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        transition: transform 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }

      .botao-jogo:hover {
        transform: scale(1.1);
      }

      @media (max-width: 768px) {
        body {
          background-position: 70%;
          background-size: cover ;
        }
        header h1 {
          font-size: 1.8em;
        }

        header button {
          align-self: center;
          margin-bottom: 10px;
        }

        .baloes {
          flex-direction: column;
          gap: 40px;
          margin-top: 50px;
          align-items: center;
        }

        .botao-jogo {
          width: 40vw;
          height: 40vw;
          font-size: 1.6em;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <button onclick="window.location.href = 'index.html'">Voltar</button>
      <h1>EducaLetra</h1>
      <p class="escolha-jogo">Escolha um jogo!</p>
    </header>

    <div class="container">
      <div class="baloes">
        <a class="botao-jogo" href="mapaletra.html">LETRA</a>
        <a class="botao-jogo" href="mapasilaba.html">SÍLABA</a>
      </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
